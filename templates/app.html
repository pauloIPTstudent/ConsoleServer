<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MQTT Cloud Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; touch-action: none; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; max-width: 300px; margin: auto; }
        button { width: 80px; height: 80px; background: #333; color: white; border: none; border-radius: 10px; font-size: 20px; touch-action: none; }
        button:active { background: #00ffcc; color: black; }
        #status { font-size: 12px; padding: 10px; color: #ff4444; }
    </style>
</head>
<body>

    <div id="status">Desconectado</div>

    <div class="grid">
        <div></div><button id="ArrowUp">↑</button><div></div>
        <button id="ArrowLeft">←</button><div></div><button id="ArrowRight">→</button>
        <div></div><button id="ArrowDown">↓</button><div></div>
    </div>

    <hr style="border: 0.5px solid #222">

    <div class="grid">
        <button id="X" style="background:#3498db">X</button>
        <button id="Y" style="background:#f1c40f">Y</button>
        <button id="A" style="background:#2ecc71">A</button>
        <button id="B" style="background:#e74c3c">B</button>
        <button id="m" style="background:#888">M</button>
    </div>

<script>
    // --- CONFIGURAÇÃO ESTÁTICA ---
    const BROKER = "752c1a993df64a28b80430f7f0948d2f.s1.eu.hivemq.cloud";
    const PORT = 8884; // Porta WebSocket TLS do HiveMQ
    const USER = "KinectV";
    const PASS = "Qwe12345";
    const TOPIC = "game/control";
    // ------------------------------

    const client = new Paho.MQTT.Client(BROKER, PORT, "client_" + Math.random().toString(16).substr(2, 8));

    const options = {
        useSSL: true,
        userName: USER,
        password: PASS,
        onSuccess: () => {
            document.getElementById('status').innerText = "CONECTADO AO CLOUD";
            document.getElementById('status').style.color = "#2ecc71";
        },
        onFailure: (e) => {
            document.getElementById('status').innerText = "ERRO: " + e.errorMessage;
        }
    };

    client.connect(options);

    function send(btnId, action) {
        if (client.isConnected()) {
            const message = new Paho.MQTT.Message(JSON.stringify({ button: btnId, action: action }));
            message.destinationName = TOPIC;
            client.send(message);
            if(action === 'press' && navigator.vibrate) navigator.vibrate(40);
        }
    }

    // Registrar eventos em todos os botões
    document.querySelectorAll('button').forEach(btn => {
        const handle = (type) => (e) => {
            e.preventDefault();
            send(btn.id, type);
        };
        btn.addEventListener('touchstart', handle('press'));
        btn.addEventListener('touchend', handle('release'));
        btn.addEventListener('mousedown', handle('press'));
        btn.addEventListener('mouseup', handle('release'));
    });

    window.oncontextmenu = (e) => e.preventDefault();
</script>
</body>
</html>
