<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle Remoto Game</title>
  <style>
    body { 
      text-align: center; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      user-select: none; 
      background-color: #1a1a1a;
      color: white;
      touch-action: none;
      margin: 0;
      overflow: hidden;
    }

    /* Ícone de Configuração */
    .settings-icon {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 30px;
      cursor: pointer;
      z-index: 10;
      opacity: 0.6;
    }

    /* Painel de Configurações (Modal) */
    #settings-panel {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #333;
      padding: 20px;
      border-radius: 15px;
      border: 2px solid #555;
      z-index: 20;
      width: 80%;
      max-width: 300px;
    }

    #settings-panel input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
    }

    #settings-panel button {
      padding: 10px 20px;
      background: #2ecc71;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 15;
    }

    .controller-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* D-PAD */
    .dpad {
      display: grid;
      grid-template-columns: 80px 80px 80px;
      grid-template-rows: 80px 80px 80px;
      gap: 5px;
      margin-bottom: 40px;
    }

    .dpad button {
      width: 80px;
      height: 80px;
      background: #333;
      border: 2px solid #444;
      color: white;
      font-size: 30px;
      border-radius: 10px;
    }

    #ArrowRight { grid-column: 1; grid-row: 2; }
    #ArrowUp    { grid-column: 2; grid-row: 1; }
    #ArrowLeft  { grid-column: 2; grid-row: 3; }
    #ArrowDown  { grid-column: 3; grid-row: 2; }

    /* Botões de Ação */
    .action-buttons {
      display: grid;
      grid-template-columns: 80px 80px;
      gap: 15px;
    }

    .action-buttons button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 20px;
      border: 3px solid #555;
    }

    #A { background: #2ecc71; color: white; }
    #B { background: #e74c3c; color: white; }
    #X { background: #3498db; color: white; }
    #Y { background: #f1c40f; color: black; }

    button:active {
      filter: brightness(1.5);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

<div class="settings-icon" onclick="toggleSettings()">⚙️</div>

<div class="overlay" id="overlay" onclick="toggleSettings()"></div>
<div id="settings-panel">
  <h3>Configurações MQTT</h3>
  <label>Endereço do Broker:</label>
  <input type="text" id="mqtt_host" placeholder="ws://192.168.1.233:9001">
  <button onclick="saveSettings()">Salvar e Reiniciar</button>
</div>

<div class="controller-container">
  <h2>DIRECIONAL</h2>
  <div class="dpad">
    <button id="ArrowUp">↑</button>
    <button id="ArrowLeft">←</button>
    <button id="ArrowDown">↓</button>
    <button id="ArrowRight">→</button>
  </div>

  <h2>AÇÕES</h2>
  <div class="action-buttons">
    <button id="X">X</button>
    <button id="Y">Y</button>
    <button id="A">A</button>
    <button id="B">B</button>
  </div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
  // Carrega o IP salvo ou usa o padrão
  let savedHost = localStorage.getItem('mqtt_host') || 'ws://192.168.1.233:9001';
  document.getElementById('mqtt_host').value = savedHost;

  const MQTT_TOPIC = 'game/control';
  let deviceId = localStorage.getItem('device_id') || ('dev_' + Math.random().toString(36).substr(2, 9));
  localStorage.setItem('device_id', deviceId);

  // Inicializa a conexão
  let client = mqtt.connect(savedHost);

  function toggleSettings() {
    const panel = document.getElementById('settings-panel');
    const overlay = document.getElementById('overlay');
    const isVisible = panel.style.display === 'block';
    panel.style.display = isVisible ? 'none' : 'block';
    overlay.style.display = isVisible ? 'none' : 'block';
  }

  function saveSettings() {
    const newHost = document.getElementById('mqtt_host').value;
    localStorage.setItem('mqtt_host', newHost);
    location.reload(); // Recarrega a página para aplicar a nova conexão
  }

  function send(button, action) {
    if (client && client.connected) {
      const msg = JSON.stringify({ 
          device_id: deviceId, 
          button: button, 
          action: action 
      });
      client.publish(MQTT_TOPIC, msg);
    }
  }

  const allButtons = document.querySelectorAll('.controller-container button');

  allButtons.forEach(btn => {
    const key = btn.id;
    const handlePress = (e) => { e.preventDefault(); send(key, 'press'); };
    const handleRelease = (e) => { e.preventDefault(); send(key, 'release'); };

    btn.addEventListener('mousedown', handlePress);
    btn.addEventListener('mouseup', handleRelease);
    btn.addEventListener('touchstart', handlePress);
    btn.addEventListener('touchend', handleRelease);
    btn.addEventListener('touchcancel', handleRelease);
  });

  window.oncontextmenu = (e) => e.preventDefault();
</script>
</body>
</html>
