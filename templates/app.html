<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle Remoto Game</title>
  <style>
    body { 
      text-align: center; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      user-select: none; 
      background-color: #1a1a1a;
      color: white;
      touch-action: none; /* Impede gestos do navegador */
    }

    .controller-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh;
    }

    /* Layout do D-PAD (Cruz) */
    .dpad {
      display: grid;
      grid-template-columns: 80px 80px 80px;
      grid-template-rows: 80px 80px 80px;
      gap: 5px;
      margin-bottom: 40px;
    }

    .dpad button {
      width: 80px;
      height: 80px;
      background: #333;
      border: 2px solid #444;
      color: white;
      font-size: 30px;
      border-radius: 10px;
    }

    /* Posicionamento das setas no Grid */
    #ArrowUp    { grid-column: 1; grid-row: 2; }
    #ArrowLeft  { grid-column: 2; grid-row: 3; }
    #ArrowDown  { grid-column: 3; grid-row: 2; }
    #ArrowRight { grid-column: 2; grid-row: 1; }

    /* Layout dos Botões de Ação */
    .action-buttons {
      display: grid;
      grid-template-columns: 80px 80px;
      gap: 15px;
    }

    .action-buttons button {
      width: 70px;
      height: 70px;
      border-radius: 50%; /* Botões redondos tipo console */
      font-weight: bold;
      font-size: 20px;
      border: 3px solid #555;
    }

    #A { background: #2ecc71; color: white; } /* Verde */
    #B { background: #e74c3c; color: white; } /* Vermelho */
    #X { background: #3498db; color: white; } /* Azul */
    #Y { background: #f1c40f; color: black; } /* Amarelo */

    button:active {
      filter: brightness(1.5);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

<div class="controller-container">
  <h2>DIRECIONAL</h2>
  <div class="dpad">
    <button id="ArrowRight">↑</button>
    <button id="ArrowUp">←</button>
    <button id="ArrowLeft">↓</button>
    <button id="ArrowDown">→</button>
  </div>

  <h2>AÇÕES</h2>
  <div class="action-buttons">
    <button id="X">X</button>
    <button id="Y">Y</button>
    <button id="A">A</button>
    <button id="B">B</button>
  </div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
  const MQTT_BROKER = 'ws://192.168.1.233:9001';
  const MQTT_TOPIC = 'game/control';

  const client = mqtt.connect(MQTT_BROKER);

  function send(button, action) {
    const msg = JSON.stringify({ button: button, action: action });
    client.publish(MQTT_TOPIC, msg);
  }

  const allButtons = document.querySelectorAll('button');

  allButtons.forEach(btn => {
    const key = btn.id;

    const handlePress = (e) => {
      e.preventDefault();
      send(key, 'press');
    };

    const handleRelease = (e) => {
      e.preventDefault();
      send(key, 'release');
    };

    // Mouse e Toque
    btn.addEventListener('mousedown', handlePress);
    btn.addEventListener('mouseup', handleRelease);
    btn.addEventListener('touchstart', handlePress);
    btn.addEventListener('touchend', handleRelease);
    btn.addEventListener('touchcancel', handleRelease);
  });

  // Bloqueia menu de contexto
  window.oncontextmenu = (e) => e.preventDefault();
</script>
</body>
</html>
